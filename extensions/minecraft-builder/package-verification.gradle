import groovy.json.JsonSlurper
import java.util.jar.JarFile

tasks.register('verifyUniversalPackage') {
    group = 'verification'
    dependsOn ':universal:shadowJar'
    doLast {
        def archive = project(':universal').tasks.named('shadowJar').get().archiveFile.get().asFile
        new JarFile(archive).withCloseable { jar ->
            def entry = jar.getJarEntry('META-INF/openallay-extension.json')
            if (entry == null) throw new GradleException('Missing universal package manifest')
            def metadata = new JsonSlurper().parse(jar.getInputStream(entry))
            if (metadata.schemaVersion != 2 || metadata.id != 'openallay:builder'
                    || metadata.version != '0.4.0'
                    || metadata.entrypoint != 'dev.openallay.builder.BuilderExtension'
                    || metadata.support.minimumJavaVersion != 8
                    || metadata.support.requiredHostFeatures != ['minecraft:world-access']
                    || metadata.requirements.keySet() != ['capabilities', 'extensions', 'skills'].toSet()
                    || metadata.requirements.capabilities != []
                    || metadata.requirements.extensions != []
                    || metadata.requirements.skills != []) {
                throw new GradleException('Universal Builder declaration mismatch')
            }
            def targets = metadata.support.targets
            def games = ['1.20.1', '1.20.2', '1.20.3', '1.20.4', '1.20.5', '1.20.6', '1.21', '1.21.1', '1.21.2', '1.21.3', '1.21.4', '1.21.5', '1.21.6', '1.21.7', '1.21.8', '1.21.9', '1.21.10', '1.21.11', '26.1', '26.1.1', '26.1.2', '26.2', '26.3']
            def declaredTargets = targets.collect { [it.loader, it.minecraftVersionRange] }
            def expectedTargets = ['fabric', 'neoforge'].collectMany { loader -> games.collect { game -> [loader, game] } }
            if (declaredTargets.size() != expectedTargets.size()
                    || declaredTargets.toSet() != expectedTargets.toSet()
                    || targets.any { it.openAllayVersionRange != '[0.4.1,)'
                        || it.openAllayApiVersionRange != '[0.4.0,0.5.0)' }) {
                throw new GradleException('Universal Builder support coordinates mismatch')
            }
            ['building.js', 'presets.js', 'terrain.js', 'openallay_skills/minecraft-builder/SKILL.md'].each { path ->
                if (jar.getJarEntry("assets/openallay_builder/${path}") == null)
                    throw new GradleException("Missing canonical Builder resource: ${path}")
            }
            if (jar.getJarEntry('dev/openallay/builder/internal/gson/Strictness.class') == null)
                throw new GradleException('Private relocated Gson is missing')
            jar.entries().each { item ->
                def name = item.name
                if (name.startsWith('com/google/gson/') || name.startsWith('dev/openallay/api/extension/')
                        || name.startsWith('net/minecraft/') || name.startsWith('net/minecraftforge/')
                        || name.startsWith('net/neoforged/') || name.startsWith('net/fabricmc/')
                        || name.startsWith('META-INF/versions/') || name == 'module-info.class'
                        || name == 'fabric.mod.json' || name == 'META-INF/neoforge.mods.toml') {
                    throw new GradleException("Nonportable class or loader payload: ${name}")
                }
                if (name.endsWith('.class')) {
                    jar.getInputStream(item).withCloseable { stream ->
                        def input = new DataInputStream(stream)
                        if (Integer.toUnsignedLong(input.readInt()) != 0xCAFEBABEL)
                            throw new GradleException('Invalid class header')
                        input.readUnsignedShort()
                        if (input.readUnsignedShort() != 52) throw new GradleException("Non-Java8 class: ${name}")
                    }
                }
            }
        }
    }
}
