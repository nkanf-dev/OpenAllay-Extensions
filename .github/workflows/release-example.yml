name: release example

on:
  push:
    tags:
      - "hello-v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: zulu
          java-version: 25
      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        with:
          gradle-version: "9.5.0"
      - name: Build loader-specific example packages
        run: gradle -p examples/hello-extension clean check
      - name: Generate checksums
        working-directory: examples/hello-extension/build/libs
        run: sha256sum openallay-hello-extension-*.jar > SHA256SUMS
      - name: Publish example release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          extension_version="${GITHUB_REF_NAME#hello-v}"
          gh release create "${GITHUB_REF_NAME}" \
            examples/hello-extension/build/libs/openallay-hello-extension-*.jar \
            examples/hello-extension/build/libs/SHA256SUMS \
            --verify-tag \
            --title "OpenAllay Hello Extension ${extension_version}" \
            --notes "Reference Extension packages for Fabric and NeoForge, compiled against OpenAllay 0.2.1 and compatible with the OpenAllay Extension API 0.2.x."
