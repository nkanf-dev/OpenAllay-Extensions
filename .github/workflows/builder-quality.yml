name: Builder native quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: builder-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  builder:
    name: Java 25 / Minecraft 26.2 / both loaders
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out Extensions source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read pinned OpenAllay source
        id: core
        shell: python
        run: |
          import json, os, re
          from pathlib import Path
          lock = json.loads(Path("extensions/minecraft-builder/openallay-source.lock.json").read_text())
          assert re.fullmatch(r"[0-9a-f]{40}", lock["revision"]), "Use an exact core commit"
          assert lock["repository"] == "nkanf-dev/OpenAllay"
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              for key in ("repository", "revision", "minecraftVersion", "openAllayVersion"):
                  print(f"{key}={lock[key]}", file=output)

      - name: Check out pinned core source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ steps.core.outputs.repository }}
          ref: ${{ steps.core.outputs.revision }}
          path: .gradle/openallay-core
          persist-credentials: false

      - name: Set up Java 25
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        with:
          cache-provider: basic
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Compile the core API without building any Extensions
        working-directory: .gradle/openallay-core
        run: ./gradlew --no-daemon :common:jar

      - name: Test Builder and build both native loader packages
        env:
          MC_VERSION: ${{ steps.core.outputs.minecraftVersion }}
          CORE_VERSION: ${{ steps.core.outputs.openAllayVersion }}
        run: >-
          ./.gradle/openallay-core/gradlew --no-daemon
          -p extensions/minecraft-builder
          "-PopenallayCommonJar=${GITHUB_WORKSPACE}/.gradle/openallay-core/common/build/libs/openallay-common-${MC_VERSION}-${CORE_VERSION}.jar"
          clean :common:test :fabric:build :neoforge:build verifyLoaderPackages
