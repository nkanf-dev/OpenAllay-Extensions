import groovy.json.JsonSlurper
import java.security.MessageDigest
import java.util.HexFormat
import java.util.jar.JarFile

plugins {
    id "java"
}

group = "dev.openallay.example"
version = "0.1.2"

def openAllayVersion = providers.gradleProperty("openallayVersion").orElse("0.2.1").get()
def openAllayArtifactsDir = providers.gradleProperty("openallayArtifactsDir")
        .map { file(it).absoluteFile }
        .orNull
def openAllayFabric = openAllayArtifactsDir == null
        ? "dev.openallay:openallay:${openAllayVersion}:fabric-26.2@jar"
        : files(new File(
                openAllayArtifactsDir,
                "fabric/build/libs/openallay-fabric-26.2-${openAllayVersion}.jar"))
def openAllayNeoForge = openAllayArtifactsDir == null
        ? "dev.openallay:openallay:${openAllayVersion}:neoforge-26.2@jar"
        : files(new File(
                openAllayArtifactsDir,
                "neoforge/build/libs/openallay-neoforge-26.2-${openAllayVersion}.jar"))

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    ivy {
        name = "openAllayGitHubReleases"
        url = uri("https://github.com/nkanf-dev/OpenAllay/releases/download")
        patternLayout {
            artifact("v[revision]/[artifact]-[classifier]-[revision].[ext]")
        }
        metadataSources {
            artifact()
        }
    }
    maven {
        url = uri("https://maven.fabricmc.net")
    }
    maven {
        url = uri("https://maven.neoforged.net/releases")
    }
    maven {
        url = uri("https://libraries.minecraft.net")
    }
    mavenCentral()
}

sourceSets {
    shared
    fabric {
        compileClasspath += sourceSets.shared.output
        runtimeClasspath += sourceSets.shared.output
    }
    neoforge {
        compileClasspath += sourceSets.shared.output
        runtimeClasspath += sourceSets.shared.output
    }
}

dependencies {
    sharedCompileOnly(openAllayFabric)

    fabricCompileOnly(openAllayFabric)
    fabricCompileOnly("net.fabricmc:fabric-loader:0.19.3")

    neoforgeCompileOnly(openAllayNeoForge)
    neoforgeCompileOnly("net.neoforged.fancymodloader:loader:11.0.13")
    neoforgeCompileOnly("net.neoforged:bus:8.0.5")
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
}

tasks.register("fabricJar", Jar) {
    group = "build"
    description = "Builds the normal Fabric Extension JAR."
    archiveBaseName = "openallay-hello-extension"
    archiveClassifier = "fabric-26.2"
    preserveFileTimestamps = false
    reproducibleFileOrder = true
    from(sourceSets.shared.output)
    from(sourceSets.fabric.output)
    duplicatesStrategy = DuplicatesStrategy.FAIL
}

tasks.register("neoforgeJar", Jar) {
    group = "build"
    description = "Builds the normal NeoForge Extension JAR."
    archiveBaseName = "openallay-hello-extension"
    archiveClassifier = "neoforge-26.2"
    preserveFileTimestamps = false
    reproducibleFileOrder = true
    from(sourceSets.shared.output)
    from(sourceSets.neoforge.output)
    duplicatesStrategy = DuplicatesStrategy.FAIL
}

tasks.named("assemble") {
    dependsOn("fabricJar", "neoforgeJar")
}

tasks.register("verifyLoaderPackages") {
    group = "verification"
    dependsOn("fabricJar", "neoforgeJar")
    doLast {
        if (openAllayArtifactsDir != null) {
            [openAllayFabric, openAllayNeoForge].each { dependency ->
                dependency.files.each {
                    if (!it.isFile()) {
                        throw new GradleException("Missing local OpenAllay artifact: ${it}")
                    }
                }
            }
        }
        def fabric = tasks.named("fabricJar").get().archiveFile.get().asFile
        def neoforge = tasks.named("neoforgeJar").get().archiveFile.get().asFile
        def verifyPackage = { File archive, String loader, String loaderMetadata, String forbiddenMetadata ->
            if (!archive.isFile() || archive.length() == 0) {
                throw new GradleException("Missing Extension package: ${archive}")
            }
            new JarFile(archive).withCloseable { jar ->
                if (jar.getJarEntry(loaderMetadata) == null
                        || jar.getJarEntry(forbiddenMetadata) != null) {
                    throw new GradleException(
                            "${loader} package has incorrect loader metadata")
                }
                def manifestEntry = jar.getJarEntry("META-INF/openallay-extension.json")
                if (manifestEntry == null) {
                    throw new GradleException("${loader} package has no Extension manifest")
                }
                def manifest = new JsonSlurper().parse(jar.getInputStream(manifestEntry))
                if (manifest.id != "example:hello"
                        || manifest.version != project.version
                        || manifest.openAllayApiVersionRange != "[0.2,0.3)"
                        || manifest.loaders != [loader]
                        || manifest.modIds != ["openallay_hello_extension"]) {
                    throw new GradleException(
                            "${loader} package manifest disagrees with its loader package")
                }
                if (loader == "fabric") {
                    def loaderEntry = jar.getJarEntry("fabric.mod.json")
                    def metadata = new JsonSlurper().parse(jar.getInputStream(loaderEntry))
                    if (metadata.depends.openallay != ">=0.2.1") {
                        throw new GradleException(
                                "Fabric package must require OpenAllay product 0.2.1 or newer")
                    }
                } else {
                    def loaderEntry = jar.getJarEntry("META-INF/neoforge.mods.toml")
                    def metadata = jar.getInputStream(loaderEntry).getText("UTF-8")
                    if (!metadata.contains('versionRange = "[0.2.1,0.3.0)"')) {
                        throw new GradleException(
                                "NeoForge package must require OpenAllay product 0.2.1 or newer")
                    }
                }
            }
            def digest = MessageDigest.getInstance("SHA-256")
                    .digest(archive.bytes)
            logger.lifecycle(
                    "${archive.name} sha256=${HexFormat.of().formatHex(digest)}")
        }
        verifyPackage(
                fabric,
                "fabric",
                "fabric.mod.json",
                "META-INF/neoforge.mods.toml")
        verifyPackage(
                neoforge,
                "neoforge",
                "META-INF/neoforge.mods.toml",
                "fabric.mod.json")
    }
}

tasks.named("check") {
    dependsOn("verifyLoaderPackages")
}
